<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#15181e">
<title>KRESZ Tanuló – magyar KRESZ tanulóhely</title>
<meta name="description" content="Magyar KRESZ tanulóhely: tananyag, tanulókártyák, pipálós feladatlisták és kvíz – minden feladathoz képpel.">
<style>
:root{
  --bg:#15181e; --bg2:#1a1e26; --card:#1f242d; --card2:#252b36; --line:#2d3441;
  --text:#d7dce5; --mute:#9aa3b2; --accent:#e3b15b; --accent-d:#b98a3d;
  --ok:#6fbf8e; --bad:#e07a6f; --blue:#6fa3e0;
  --r:18px; --shadow:0 8px 24px rgba(0,0,0,.28);
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(111,163,224,.07),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(227,177,91,.06),transparent 60%);
  background-attachment:fixed}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,5vw,3rem)} h2{font-size:clamp(1.4rem,3.2vw,1.9rem)} h3{font-size:1.15rem}
p{margin:0 0 1em}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#111;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
::selection{background:rgba(227,177,91,.35)}

/* ---------- Fejléc / navigáció ---------- */
header.top{position:sticky;top:0;z-index:50;background:rgba(21,24,30,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:1.1rem;white-space:nowrap}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#c4783a);display:grid;place-items:center;color:#1a1408;font-weight:900}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:.7rem;margin-top:-2px}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs a{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;text-decoration:none;color:var(--mute);font-weight:600;font-size:.95rem;transition:.15s}
nav.tabs a:hover{background:var(--card);color:var(--text)}
nav.tabs a[aria-current=page]{background:var(--card2);color:var(--accent)}
nav.tabs .ic{font-size:1.1rem}
main{max-width:1180px;margin:0 auto;padding:22px 16px 110px}
.view{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(max-width:860px){
  header.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(21,24,30,.97)}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;gap:0;z-index:60;background:rgba(26,30,38,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  nav.tabs a{flex-direction:column;gap:2px;padding:6px 4px;font-size:.68rem;flex:1;border-radius:10px;text-align:center}
  nav.tabs .ic{font-size:1.35rem}
  .brand small{display:none}
}

/* ---------- Közös elemek ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pic{position:relative;background:#2a3340;aspect-ratio:16/9;overflow:hidden}
.pic svg{display:block;width:100%;height:100%}
.pic .tag{position:absolute;left:10px;top:10px;background:rgba(15,18,24,.78);color:var(--text);font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.03em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card2);padding:11px 18px;border-radius:14px;font-weight:700;text-decoration:none;color:var(--text);transition:.15s;min-height:46px}
.btn:hover{border-color:#44506a;transform:translateY(-1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1407}
.btn.pri:hover{background:#ecbd6e}
.btn.ok{background:rgba(111,191,142,.15);border-color:rgba(111,191,142,.5);color:var(--ok)}
.btn.bad{background:rgba(224,122,111,.13);border-color:rgba(224,122,111,.5);color:var(--bad)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--bg2);color:var(--mute);padding:7px 14px;border-radius:99px;font-weight:600;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#1b1407}
.bar{height:10px;border-radius:99px;background:#11141a;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#8fd3a8);border-radius:99px;transition:width .4s}
.pagehead{margin-bottom:22px}
.pagehead p{color:var(--mute);max-width:70ch;margin:0}
.badge{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:rgba(111,163,224,.14);color:var(--blue)}
.badge.warn{background:rgba(227,177,91,.14);color:var(--accent)}
.badge.ok{background:rgba(111,191,142,.14);color:var(--ok)}

/* ---------- Kezdőlap ---------- */
.hero{display:grid;gap:26px;grid-template-columns:1.1fr .9fr;align-items:center;margin-bottom:34px}
.hero .lead{font-size:1.1rem;color:var(--mute);max-width:56ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .pic{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
@media(max-width:820px){.hero{grid-template-columns:1fr}.hero .pic{order:-1}}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:34px}
.stat{padding:16px 18px}
.stat b{display:block;font-size:1.8rem;color:var(--accent);line-height:1.1}
.stat span{color:var(--mute);font-size:.88rem}
.stat .bar{margin-top:10px}
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));margin-bottom:34px;counter-reset:s}
.step{position:relative}
.step .body{padding:16px 18px 20px}
.step .num{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#1b1407;font-weight:900;display:grid;place-items:center;z-index:2}
.step p{color:var(--mute);margin:0 0 14px;font-size:.95rem}
.note{padding:14px 18px;border-left:4px solid var(--accent);background:var(--bg2);border-radius:0 14px 14px 0;color:var(--mute);font-size:.92rem}
.daily{display:grid;grid-template-columns:1fr 1fr;gap:0}
.daily .t{padding:20px}
@media(max-width:700px){.daily{grid-template-columns:1fr}}

/* ---------- Tanulás ---------- */
.lesson-card{display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:.2s;position:relative}
.lesson-card:hover{transform:translateY(-3px);border-color:#44506a}
.lesson-card .b{padding:14px 16px 18px;flex:1}
.lesson-card h3{margin:0 0 6px}
.lesson-card p{margin:0;color:var(--mute);font-size:.92rem}
.read-mark{position:absolute;right:10px;top:10px;background:var(--ok);color:#10261a;border-radius:99px;font-size:.72rem;font-weight:800;padding:3px 10px;z-index:2}
.lesson{display:grid;gap:24px;grid-template-columns:1.05fr .95fr;align-items:start}
@media(max-width:860px){.lesson{grid-template-columns:1fr}}
.lesson .pic{border-radius:var(--r);border:1px solid var(--line)}
.todo{list-style:none;padding:0;margin:0 0 18px;counter-reset:t}
.todo li{counter-increment:t;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.todo li::before{content:counter(t);flex:none;width:28px;height:28px;border-radius:50%;background:var(--card2);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:.9rem}
.tip{padding:14px 16px;border-radius:14px;background:rgba(227,177,91,.09);border:1px solid rgba(227,177,91,.3);margin-bottom:18px}
.tip b{color:var(--accent)}
.crumb{display:inline-flex;gap:6px;color:var(--mute);text-decoration:none;margin-bottom:14px;font-weight:600}
.crumb:hover{color:var(--text)}

/* ---------- Jelek ---------- */
.search{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:12px 16px;font:inherit;margin-bottom:14px}
.signcard .pic{aspect-ratio:4/3}
.signcard .b{padding:12px 14px 16px}
.signcard h3{font-size:1rem;margin:0 0 4px}
.signcard p{margin:0;color:var(--mute);font-size:.88rem}

/* ---------- Kártyák ---------- */
.deckwrap{max-width:640px;margin:0 auto}
.flip{perspective:1200px;margin-bottom:16px}
.flip-in{position:relative;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;min-height:430px}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;cursor:pointer}
.face.back{transform:rotateY(180deg);background:var(--card2)}
.face .pic{aspect-ratio:16/9;flex:none}
.face .txt{padding:18px 22px;flex:1;display:flex;flex-direction:column;justify-content:center}
.face .q{font-size:1.25rem;font-weight:700}
.face .hint{margin-top:auto;color:var(--mute);font-size:.82rem}
.face .a{font-size:1.1rem}
.face .a b{color:var(--accent)}
@media(max-width:480px){.flip-in{min-height:460px}.face .q{font-size:1.1rem}}
@media(prefers-reduced-motion:reduce){.flip-in{transition:none}.view{animation:none}*{scroll-behavior:auto!important}}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#333b49}
.dots i.k{background:var(--ok)} .dots i.n{background:var(--bad)} .dots i.cur{outline:2px solid var(--accent);outline-offset:2px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Pipálós lista ---------- */
.list-card .head{padding:18px 20px;display:flex;gap:14px;align-items:center;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.list-card .head .ico{font-size:1.8rem}
.list-card .head h3{margin:0}
.list-card .head p{margin:0;color:var(--mute);font-size:.88rem}
.list-card .inner{padding:0 16px 16px}
.lists{display:grid;gap:16px}
.items{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.item{position:relative;background:var(--bg2);border:2px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;text-align:left;padding:0;display:block;width:100%}
.item .pic{aspect-ratio:2/1;transition:.2s}
.item .b{padding:12px 14px 14px;padding-right:56px}
.item b{display:block;font-size:1rem;margin-bottom:2px}
.item span{color:var(--mute);font-size:.88rem;display:block}
.item .box{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:10px;border:2px solid #4a5468;display:grid;place-items:center;font-size:1.25rem;color:transparent;background:var(--card);transition:.2s}
.item[aria-checked=true]{border-color:rgba(111,191,142,.65);background:rgba(111,191,142,.07)}
.item[aria-checked=true] .box{background:var(--ok);border-color:var(--ok);color:#0f2418}
.item[aria-checked=true] .pic{opacity:.55;filter:saturate(.6)}
.item[aria-checked=true] b{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.lp{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.lp .bar{flex:1}
.lp small{color:var(--mute);white-space:nowrap}

/* ---------- Kvíz ---------- */
.quiz{max-width:720px;margin:0 auto}
.quiz .pic{border-radius:var(--r) var(--r) 0 0}
.q-body{padding:20px 22px 24px}
.q-body h2{font-size:1.3rem}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:600;transition:.15s;display:flex;gap:12px;align-items:center}
.opt:hover{border-color:#4a5772}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:.85rem;color:var(--accent)}
.opt.right{border-color:var(--ok);background:rgba(111,191,142,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(224,122,111,.12)}
.opt[disabled]{cursor:default}
.expl{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.score{text-align:center;padding:30px 22px}
.score .big{font-size:3.6rem;font-weight:900;color:var(--accent);line-height:1}
.qtop{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;color:var(--mute);font-weight:600}

footer{max-width:1180px;margin:0 auto;padding:0 16px 120px;color:var(--mute);font-size:.82rem}
footer p{border-top:1px solid var(--line);padding-top:16px}
@media(min-width:861px){footer{padding-bottom:40px}main{padding-bottom:50px}}
</style>
</head>
<body>
<a class="skip" href="#app">Ugrás a tartalomra</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34445a"/><stop offset="1" stop-color="#4b5d74"/></linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a28"/><stop offset="1" stop-color="#243044"/></linearGradient>
</defs></svg>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/home"><span class="logo">K</span><span>KRESZ Tanuló<small>magyar közlekedési szabályok</small></span></a>
    <nav class="tabs" id="tabs" aria-label="Fő menü"></nav>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer><p>Ez az oldal tanulássegítő, gyakorlásra és ismétlésre való. A hivatalos tananyagot és a hatályos szabályokat mindig a KRESZ-tankönyvben, az autósiskolában és a hivatalos forrásokban ellenőrizd. A képek egyszerűsített szemléltető ábrák.</p></footer>

<script>
/* =====================================================================
   ÁLLAPOT (a haladás a böngészőben mentődik)
===================================================================== */
const KEY='kresz-tanulo-v1';
let state={known:{},checks:{},read:{},best:0,runs:0,miss:{}};
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* =====================================================================
   KÉPEK – minden feladathoz saját ábra (beágyazott SVG)
===================================================================== */
const U=i=>`<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${i}</svg>`;
const GR='<rect width="320" height="180" fill="#2d3b33"/>';
const SKY='<rect width="320" height="180" fill="url(#sky)"/><rect y="128" width="320" height="52" fill="#2f3d36"/>';
const NIGHT='<rect width="320" height="180" fill="url(#night)"/>';
const T=(x,y,s,t,c='#e8ebf0',w=700,a='middle')=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="${w}" fill="${c}" text-anchor="${a}" font-family="Arial,Helvetica,sans-serif">${t}</text>`;
const pill=(x,y,t,c)=>`<g><rect x="${x-34}" y="${y-11}" width="68" height="22" rx="11" fill="${c}"/>${T(x,y+5,12,t,'#101418',800)}</g>`;
const car=(x,y,c='#5b8fd9',r=0,s=1)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><rect x="-12" y="-22" width="24" height="44" rx="8" fill="${c}"/><rect x="-9" y="-11" width="18" height="10" rx="3" fill="#1b2430" opacity=".9"/><rect x="-9" y="7" width="18" height="8" rx="3" fill="#1b2430" opacity=".9"/><rect x="-10" y="-22" width="5" height="3" rx="1" fill="#ffe9a6"/><rect x="5" y="-22" width="5" height="3" rx="1" fill="#ffe9a6"/></g>`;
const ped=(x,y,c='#d6735e')=>`<g transform="translate(${x} ${y})"><circle cy="-15" r="5.5" fill="#f1c9a5"/><rect x="-5.5" y="-9" width="11" height="17" rx="5" fill="${c}"/><rect x="-5" y="8" width="4.5" height="10" rx="2" fill="#262b35"/><rect x=".5" y="8" width="4.5" height="10" rx="2" fill="#262b35"/></g>`;
const sg=(n,x,y,w)=>`<svg x="${x}" y="${y}" width="${w}" height="${w}" viewBox="0 0 100 100">${typeof SIGN[n]==='function'?SIGN[n]():SIGN[n]}</svg>`;
const tri=inner=>`<path d="M50 8 L95 88 H5 Z" fill="#f4f1ea" stroke="#c0392b" stroke-width="8" stroke-linejoin="round"/>${inner}`;
const arrow=(x1,y1,x2,y2,c='#6fbf8e')=>{const a=Math.atan2(y2-y1,x2-x1),h=9;return `<g stroke="${c}" fill="${c}" stroke-width="3"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><polygon points="${x2},${y2} ${x2-h*Math.cos(a-.5)},${y2-h*Math.sin(a-.5)} ${x2-h*Math.cos(a+.5)},${y2-h*Math.sin(a+.5)}" stroke="none"/></g>`};

const SIGN={
  yield:`<path d="M8 12 H92 L50 90 Z" fill="#f4f1ea" stroke="#c0392b" stroke-width="9" stroke-linejoin="round"/>`,
  stop:`<polygon points="31,5 69,5 95,31 95,69 69,95 31,95 5,69 5,31" fill="#c0392b" stroke="#f4f1ea" stroke-width="4"/>${T(50,60,26,'STOP','#fff',800)}`,
  priority:`<polygon points="50,3 97,50 50,97 3,50" fill="#f4f1ea"/><polygon points="50,10 90,50 50,90 10,50" fill="#f2c230" stroke="#222" stroke-width="2"/>`,
  priorityEnd:`<polygon points="50,3 97,50 50,97 3,50" fill="#f4f1ea"/><polygon points="50,10 90,50 50,90 10,50" fill="#f2c230" stroke="#222" stroke-width="2"/><line x1="18" y1="82" x2="82" y2="18" stroke="#222" stroke-width="5"/>`,
  s30:()=>spd(30),s50:()=>spd(50),s90:()=>spd(90),s110:()=>spd(110),s130:()=>spd(130),
  noentry:`<circle cx="50" cy="50" r="45" fill="#c0392b" stroke="#f4f1ea" stroke-width="4"/><rect x="21" y="42" width="58" height="16" rx="2" fill="#fff"/>`,
  nostop:`<circle cx="50" cy="50" r="42" fill="#2f6fb5" stroke="#c0392b" stroke-width="9"/><path d="M26 26L74 74M74 26L26 74" stroke="#c0392b" stroke-width="9"/>`,
  nopark:`<circle cx="50" cy="50" r="42" fill="#2f6fb5" stroke="#c0392b" stroke-width="9"/><path d="M26 74L74 26" stroke="#c0392b" stroke-width="10"/>`,

function pic(key,tag){
  const f=IMG[key]||(key.startsWith('sign_')?()=>signPic(key.slice(5)):null);
  return `<div class="pic">${f?f():''}${tag?`<span class="tag">${esc(tag)}</span>`:''}</div>`;
}

const stats=()=>{
  const ck=Object.keys(state.known).filter(k=>state.known[k]===1).length;
  const items=LISTS.reduce((a,l)=>a+l.items.length,0);
  const done=Object.values(state.checks).filter(Boolean).length;
  const rd=Object.keys(state.read).length;
  return{ck,cards:CARDS.length,items,done,rd,lessons:LESSONS.length,
    pc:Math.round(ck/CARDS.length*100),pi:Math.round(done/items*100),pl:Math.round(rd/LESSONS.length*100),best:state.best};
};

  <p class="muted" style="margin-bottom:16px">Négy egyszerű lépés. A képek a feladatot mutatják, a választ neked kell kitalálni.</p>
  <section class="steps">
    <div class="card step"><span class="num">1</span>${pic('signs','Tanulás')}<div class="body"><h3>Olvasd el a tananyagot</h3><p>Rövid leckék: mit jelent, mit kell csinálni, tippekkel. </p><a class="btn" href="#/learn">Tananyag</a></div></div>
    <div class="card step"><span class="num">2</span>${pic('intersect','Kártyák')}<div class="body"><h3>Gyakorolj kártyákkal</h3><p>Kérdés elöl, válasz hátul. Jelöld, ha már tudod.</p><a class="btn" href="#/cards">Kártyák</a></div></div>
    <div class="card step"><span class="num">3</span>${pic('exam','Pipálós')}<div class="body"><h3>Pipáld a feladatokat</h3><p>Listák: út a jogosítványig, vizsga előtt, indulás előtt.</p><a class="btn" href="#/check">Pipálós</a></div></div>
    <div class="card step"><span class="num">4</span>${pic('license','Kvíz')}<div class="body"><h3>Teszteld magad</h3><p>Több mint 150 képes kérdés, próbavizsga és témakörök, magyarázattal.</p><a class="btn" href="#/quiz">Kvíz</a></div></div>
  </section>

  <h2>Mai kártya</h2>
  <section class="card daily">
    ${pic(d[1],d[0])}
    <div class="t"><span class="badge">${esc(d[0])}</span><h3 style="margin-top:12px">${esc(d[2])}</h3><p class="muted">${d[3]}</p><a class="btn" href="#/cards">Összes kártya</a></div>
  </section>
  <p class="note" style="margin-top:28px">Tipp: a haladásod automatikusan mentődik ebben a böngészőben.</p>
  <p style="margin-top:12px"><button class="btn ghost" id="reset">Haladás törlése</button></p>
  </div>`;
}

function viewLearn(id){
  if(id){
    const i=LESSONS.findIndex(l=>l.id===id);
    if(i<0) return viewLearn();
    const l=LESSONS[i];
    state.read[l.id]=1;save();
    const rel=TOPICS.find(t=>l.t.toLowerCase().includes(t.toLowerCase()));
    const p=LESSONS[i-1],n=LESSONS[i+1];
    return `<div class="view"><a class="crumb" href="#/learn">← Vissza a tananyaghoz</a>
    <div class="lesson">
      <div><div class="card" style="border-radius:var(--r)">${pic(l.img,'Lecke '+(i+1))}</div></div>
      <div>
        <span class="badge ok">✓ elolvasva</span>
        <h1 style="font-size:clamp(1.6rem,4vw,2.3rem);margin-top:10px">${l.ico} ${esc(l.t)}</h1>
        <p class="muted" style="font-size:1.05rem">${esc(l.lead)}</p>
        <h3>Mit kell tenned?</h3>
        <ol class="todo">${l.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>
        <div class="tip"><b>💡 Tipp:</b> ${esc(l.tip)}</div>
        <div class="row"><a class="btn pri" href="#/cards">🃏 Gyakorlás kártyákkal</a><a class="btn" href="#/quiz">📝 Kvíz</a></div>
        <div class="twin" style="margin-top:18px">
          ${p?`<a class="btn" href="#/learn/${p.id}">← ${esc(p.t)}</a>`:'<span></span>'}
          ${n?`<a class="btn" href="#/learn/${n.id}">${esc(n.t)} →</a>`:'<span></span>'}
        </div>
      </div>
    </div></div>`;
  }
  return `<div class="view"><div class="pagehead"><h1>📚 Tanulás</h1><p>${LESSONS.length} rövid lecke. Minden leckében kép, lépésenként elmagyarázva, mit kell csinálni.</p></div>
  <div class="lp"><div class="bar"><i style="width:${stats().pl}%"></i></div><small>${stats().rd}/${LESSONS.length} lecke</small></div>
  <div class="grid">${LESSONS.map((l,i)=>`<a class="card lesson-card" href="#/learn/${l.id}">${state.read[l.id]?'<span class="read-mark">✓ kész</span>':''}${pic(l.img,(i+1)+'. lecke')}<div class="b"><h3>${l.ico} ${esc(l.t)}</h3><p>${esc(l.lead)}</p></div></a>`).join('')}</div></div>`;
}

let signCat='Mind',signQ='';
function viewSigns(){
  const cats=['Mind','Elsőbbség','Veszély','Tiltó','Kötelező','Tájékoztató'];
  return `<div class="view"><div class="pagehead"><h1>🪧 Jelek</h1><p>Az alapvető magyar közlekedési táblák képpel. A forma és a szín már sokat elárul.</p></div>
  <input class="search" id="sq" type="search" placeholder="Keresés… (pl. STOP, 50, gyalogos)" value="${esc(signQ)}" aria-label="Keresés a jelek között">
  <div class="chips" id="scats">${cats.map(c=>`<button class="chip" aria-pressed="${c===signCat}" data-c="${c}">${c}</button>`).join('')}</div>
  <div class="grid" id="sgrid"></div></div>`;
}
function fillSigns(){
  const q=signQ.toLowerCase();
  const list=SIGNS.filter(s=>(signCat==='Mind'||s[2]===signCat)&&(!q||(s[1]+' '+s[3]).toLowerCase().includes(q)));
  $('#sgrid').innerHTML=list.length?list.map(s=>`<article class="card signcard">${pic('sign_'+s[0],s[2])}<div class="b"><h3>${esc(s[1])}</h3><p>${esc(s[3])}</p></div></article>`).join(''):'<p class="muted">Nincs találat.</p>';
}

let deck=[],di=0,flipped=false,topic='Mind',onlyNew=false;
function buildDeck(){
  deck=CARDS.map((c,i)=>({c,i})).filter(o=>(topic==='Mind'||o.c[0]===topic)&&(!onlyNew||state.known[o.i]!==1));
  if(di>=deck.length)di=0;
}
function viewCards(){
  buildDeck();
  return `<div class="view"><div class="pagehead"><h1>🃏 Kártyák</h1><p>Olvasd el a kérdést, gondold végig, majd fordítsd meg. Jelöld, hogy tudtad-e, a tudott kártyák zöldek lesznek.</p></div>
  <div class="chips" id="tchips">${TOPICS.map(t=>`<button class="chip" aria-pressed="${t===topic}" data-t="${t}">${t}</button>`).join('')}
    <button class="chip" id="only" aria-pressed="${onlyNew}">Csak amit még nem tudok</button></div>
  <div class="deckwrap" id="deck"></div></div>`;
}
function fillDeck(){
  const el=$('#deck');if(!el)return;
  if(!deck.length){el.innerHTML=`<div class="card score"><div class="big">🎉</div><h2 style="margin-top:12px">Ezt a paklit mind tudod!</h2><p class="muted">Válassz másik témát, vagy kapcsold ki a szűrőt.</p></div>`;return}
  const o=deck[di],c=o.c;flipped=false;
  const k=state.known[o.i];
  el.innerHTML=`<div class="muted" style="text-align:center;margin-bottom:10px">${di+1} / ${deck.length} · ${esc(c[0])}</div>
  <div class="flip" id="flip"><div class="flip-in">
    <div class="face front" tabindex="0" role="button" aria-label="Kártya megfordítása">${pic(c[1],c[0])}<div class="txt"><div class="q">${esc(c[2])}</div><div class="hint">👆 Koppints a kártyára a válaszért</div></div></div>
    <div class="face back" tabindex="0" role="button" aria-label="Vissza a kérdéshez">${pic(c[1],'Válasz')}<div class="txt"><div class="a">${c[3]}</div><div class="hint">👆 Koppints a kérdéshez</div></div></div>
  </div></div>
  <div class="twin"><button class="btn bad" data-k="0">✗ Még nem megy</button><button class="btn ok" data-k="1">✓ Tudom</button></div>
  <div class="dots">${deck.map((d,j)=>`<i class="${state.known[d.i]===1?'k':state.known[d.i]===0?'n':''} ${j===di?'cur':''}"></i>`).join('')}</div>
  <div class="twin"><button class="btn" id="prev">← Előző</button><button class="btn" id="next">Következő →</button></div>
  <p style="text-align:center;margin-top:14px"><button class="btn ghost" id="shuf">🔀 Keverés</button></p>`;
  const fl=$('#flip');
  const toggle=()=>{fl.classList.toggle('on')};
  $$('.face',el).forEach(f=>{f.onclick=toggle;f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}}});
  $$('[data-k]',el).forEach(b=>b.onclick=()=>{state.known[o.i]=+b.dataset.k;save();di=(di+1)%deck.length;if(onlyNew)buildDeck();fillDeck()});
  $('#prev').onclick=()=>{di=(di-1+deck.length)%deck.length;fillDeck()};
  $('#next').onclick=()=>{di=(di+1)%deck.length;fillDeck()};
  $('#shuf').onclick=()=>{deck=shuffle(deck);di=0;fillDeck()};
}

function viewCheck(){
  return `<div class="view"><div class="pagehead"><h1>✅ Pipálós feladatok</h1><p>Koppints egy feladatra, ha megcsináltad vagy tudod. Minden feladatnál kép mutatja, miről van szó.</p></div>
  <div class="lists">${LISTS.map(l=>{
    const done=l.items.filter((_,i)=>state.checks[l.id+i]).length,p=Math.round(done/l.items.length*100);
    return `<section class="card list-card" data-l="${l.id}"><button class="head" aria-expanded="true" data-h="${l.id}"><span class="ico">${l.ico}</span><span style="flex:1"><h3>${esc(l.t)}</h3><p>${esc(l.d)}</p></span><span class="badge ${p===100?'ok':''}">${done}/${l.items.length}</span></button>
    <div class="inner"><div class="lp"><div class="bar"><i style="width:${p}%"></i></div><small>${p}%</small></div>
    <div class="items">${l.items.map((it,i)=>`<button class="item" role="checkbox" aria-checked="${!!state.checks[l.id+i]}" data-c="${l.id+i}">${pic(it[0])}<div class="b"><b>${esc(it[1])}</b><span>${esc(it[2])}</span></div><span class="box" aria-hidden="true">✓</span></button>`).join('')}</div>
    <p style="margin:14px 0 0"><button class="btn ghost" data-rs="${l.id}">Lista törlése</button></p></div></section>`}).join('')}</div></div>`;
}

let qz=null,qcat='Mind';
const mkQ=i=>{const r=QRAW[i],idx=shuffle([0,1,2]),all=[r[3],r[4],r[5]];return{id:i,cat:r[0],img:r[1],q:r[2],o:idx.map(k=>all[k]),c:idx.indexOf(0),e:r[6]}};
const startQuiz=(mode)=>{
  let ids=QRAW.map((_,i)=>i);
  if(mode==='quick')ids=shuffle(ids).slice(0,10);
  else if(mode==='exam')ids=shuffle(ids).slice(0,30);
  else if(mode==='cat')ids=shuffle(ids.filter(i=>qcat==='Mind'||QRAW[i][0]===qcat));
  else if(mode==='miss')ids=shuffle(ids.filter(i=>state.miss[i]));
  if(!ids.length)return;
  qz={mode,q:ids.map(mkQ),i:0,s:0,bad:{}};render();
};
function viewQuiz(){
  if(!qz){
    const mc=Object.keys(state.miss).length;
    return `<div class="view quiz"><div class="pagehead"><h1>📝 Kvíz</h1><p>${QRAW.length} kérdés a vizsga témaköreiből, mindegyikhez kép. A kérdés képe a feladatot mutatja, a választ neked kell kitalálni. Minden válasz után magyarázatot kapsz.</p></div>
    <p class="muted">Legjobb eredményed: <b style="color:var(--accent)">${state.best}%</b> · kitöltött kvízek: ${state.runs}</p>
    <div class="grid" style="margin:16px 0 22px">
      <div class="card"><div class="q-body"><h3>⚡ Gyors kvíz</h3><p class="muted">10 véletlen kérdés a teljes anyagból.</p><button class="btn pri" data-m="quick">Indítás</button></div></div>
      <div class="card"><div class="q-body"><h3>🎓 Próbavizsga</h3><p class="muted">30 véletlen kérdés egyben, vizsgahangulatban. A hivatalos vizsga felépítése eltérhet, ez gyakorlásra való.</p><button class="btn pri" data-m="exam">Indítás</button></div></div>
      <div class="card"><div class="q-body"><h3>🔁 Hibáim</h3><p class="muted">Azok a kérdések, amiket korábban elrontottál (${mc}).</p><button class="btn" data-m="miss" ${mc?'':'disabled'}>Gyakorlás</button></div></div>
    </div>
    <h2>📂 Témakör szerint</h2>
    <div class="chips" id="qcats">${QCATS.map(c=>`<button class="chip" aria-pressed="${c===qcat}" data-qc="${c}">${esc(c)} (${c==='Mind'?QRAW.length:QRAW.filter(q=>q[0]===c).length})</button>`).join('')}</div>
    <button class="btn pri" data-m="cat">Témakör indítása</button></div>`;
  }
  if(qz.i>=qz.q.length){
    const p=Math.round(qz.s/qz.q.length*100),weak=Object.entries(qz.bad).sort((a,b)=>b[1]-a[1]);
    return `<div class="view quiz"><div class="card score"><div class="big">${p}%</div><h2 style="margin:14px 0">${qz.s} / ${qz.q.length} helyes válasz</h2><p class="muted">${p>=90?'Kiváló! Vizsgára kész vagy.':p>=70?'Nagyon jó, még egy kis gyakorlás!':'Ismételd át a kártyákat és a tananyagot, menni fog!'}</p>
    ${weak.length?`<p class="muted">Ezeket érdemes átnézni: ${weak.map(w=>`<b>${esc(w[0])}</b> (${w[1]})`).join(', ')}</p>`:''}
    <div class="row" style="justify-content:center"><button class="btn pri" id="again">🔁 Újra</button><button class="btn" id="menu">📂 Menü</button><a class="btn" href="#/cards">🃏 Kártyák</a><a class="btn" href="#/learn">📚 Tananyag</a></div></div></div>`;
  }
  const q=qz.q[qz.i];
  return `<div class="view quiz"><div class="qtop"><span>${qz.i+1} / ${qz.q.length} · ${esc(q.cat)}</span><span>✓ ${qz.s}</span></div><div class="bar" style="margin-bottom:14px"><i style="width:${qz.i/qz.q.length*100}%"></i></div>
  <div class="card">${pic(q.img)}<div class="q-body"><h2>${esc(q.q)}</h2><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-o="${i}"><span class="l">${'ABC'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="ex"></div></div></div>
  <p style="margin-top:14px"><button class="btn ghost" id="menu">✕ Kilépés</button></p></div>`;
}

/* =====================================================================
   ROUTER
===================================================================== */
function render(){
  const [r,arg]=(location.hash.replace(/^#\//,'')||'home').split('/');
  const route=NAV.find(n=>n[0]===r)?r:'home';
  $$('#tabs a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.r===route)||a.removeAttribute('aria-current'));
  $$('#tabs a').forEach(a=>{if(a.dataset.r===route)a.setAttribute('aria-current','page')});
  const app=$('#app');
  app.innerHTML=({home:viewHome,learn:()=>viewLearn(arg),signs:viewSigns,cards:viewCards,check:viewCheck,quiz:viewQuiz})[route]();
  window.scrollTo({top:0});
  bind(route);
}
function bind(route){
  if(route==='home'){const b=$('#reset');if(b)b.onclick=()=>{if(confirm('Biztosan törlöd az összes haladásodat?')){state={known:{},checks:{},read:{},best:0,runs:0,miss:{}};save();render()}}}
  if(route==='signs'){fillSigns();$('#sq').oninput=e=>{signQ=e.target.value;fillSigns()};$$('#scats .chip').forEach(b=>b.onclick=()=>{signCat=b.dataset.c;$$('#scats .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));fillSigns()})}
  if(route==='cards'){fillDeck();$$('#tchips [data-t]').forEach(b=>b.onclick=()=>{topic=b.dataset.t;di=0;render()});$('#only').onclick=()=>{onlyNew=!onlyNew;di=0;render()}}
  if(route==='check'){
    $$('.list-card .head').forEach(h=>h.onclick=()=>{const c=h.closest('.list-card'),inner=$('.inner',c),open=inner.hidden;inner.hidden=!open;h.setAttribute('aria-expanded',open)});
    $$('.item').forEach(b=>b.onclick=()=>{const k=b.dataset.c;state.checks[k]=!state.checks[k];if(!state.checks[k])delete state.checks[k];save();const y=window.scrollY;render();window.scrollTo({top:y})});
    $$('[data-rs]').forEach(b=>b.onclick=()=>{const L=LISTS.find(l=>l.id===b.dataset.rs);L.items.forEach((_,i)=>delete state.checks[L.id+i]);save();const y=window.scrollY;render();window.scrollTo({top:y})});
  }
  if(route==='quiz'){
    $$('[data-m]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.m));
    $$('[data-qc]').forEach(b=>b.onclick=()=>{qcat=b.dataset.qc;$$('[data-qc]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    const ag=$('#again');if(ag)ag.onclick=()=>startQuiz(qz.mode);
    const mn=$('#menu');if(mn)mn.onclick=()=>{qz=null;render()};
    $$('.opt').forEach(b=>b.onclick=()=>{
      const q=qz.q[qz.i],ok=+b.dataset.o===q.c;
      $$('.opt').forEach((x,i)=>{x.disabled=true;if(i===q.c)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
      if(ok){qz.s++;delete state.miss[q.id]}else{state.miss[q.id]=1;qz.bad[q.cat]=(qz.bad[q.cat]||0)+1}
      save();
      $('#ex').innerHTML=`<div class="expl"><b style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'✓ Helyes!':'✗ Nem ez volt.'}</b> ${esc(q.e)}${ok?'':`<br><span class="muted">Helyes válasz: <b>${esc(q.o[q.c])}</b></span>`}</div><p style="margin:16px 0 0"><button class="btn pri" id="nx">${qz.i+1>=qz.q.length?'Eredmény':'Következő →'}</button></p>`;
      $('#nx').onclick=()=>{qz.i++;if(qz.i>=qz.q.length&&(qz.mode==='quick'||qz.mode==='exam')){const p=Math.round(qz.s/qz.q.length*100);state.runs++;state.best=Math.max(state.best,p);save()}render()};
      $('#nx').focus();
    });
  }
}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
